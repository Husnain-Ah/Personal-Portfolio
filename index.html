<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Personal Portfolio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- React mounts into #root during development (see /client). This static header is a fallback for no-JS views. -->
  <div id="root">
    <header class="site-header" role="banner" aria-label="Site header">
      <div class="site-title">
        <span class="logo" aria-hidden="true"></span>
        <div>
          <h1>Hello World!</h1>
          <p class="lead">Welcome to my personal portfolio — a simple semantic header example.</p>
        </div>
      </div>
    </header>
  </div>
</body>
</html>
